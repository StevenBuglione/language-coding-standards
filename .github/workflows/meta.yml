name: meta

on:
  push:
  pull_request:
  schedule:
    - cron: "23 5 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflows:
    name: Lint GitHub workflows + enforce LF
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: actionlint over .github/workflows/**
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12

      - name: Fail on any CR byte (LF-only policy)
        run: |
          offenders="$(git grep --cached -Il $'\r' -- . || true)"
          if [ -n "$offenders" ]; then
            echo "::error::CR bytes found in tracked files; LF-only policy violated:"
            echo "$offenders"
            exit 1
          fi
          echo "No CR bytes in tracked files."

  dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: hadolint over **/Dockerfile
        run: |
          mapfile -t dockerfiles < <(find . -type f -name 'Dockerfile' | sort)
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "No Dockerfiles exist yet; skipping hadolint (config .hadolint.yaml is passed once they do)."
            exit 0
          fi
          rc=0
          for f in "${dockerfiles[@]}"; do
            echo "::group::hadolint ${f}"
            docker run --rm --entrypoint hadolint -v "$GITHUB_WORKSPACE:/repo:ro" \
              hadolint/hadolint:v2.15.1 \
              -c /repo/.hadolint.yaml "/repo/${f}" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: gitleaks detect (--no-git)
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          zricethezav/gitleaks:v8.30.1
          detect --source /repo --no-git --config /repo/.gitleaks.toml

  action-pins:
    name: Enforce action pinning policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require full commit SHA or local reusable workflow
        shell: bash
        run: |
          rc=0
          while IFS= read -r u; do
            if [[ "$u" == ./* ]]; then
              :
            elif [[ "$u" =~ ^[A-Za-z0-9._-]+/[A-Za-z0-9._/-]+@[0-9a-f]{40}$ ]]; then
              :
            else
              echo "::error::uses: ref must be owner/repo@<40-char-sha> or local './...': '${u}'"
              rc=1
            fi
          done < <(sed -nE 's/^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*([^[:space:]#]+).*$/\2/p' .github/workflows/*.yml)
          if [ "$rc" -eq 0 ]; then
            echo "All uses: refs are full-SHA pinned or local."
          fi
          exit "$rc"

  contract:
    name: Manifest + conformance schema
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate conformance vectors
        run: python3 conformance/v2/validate.py
      - name: Conformance unit tests
        run: python3 -m unittest discover -s conformance/v2/tests
      - name: Manifest default selection
        run: |
          mapfile -t langs < <(python3 scripts/manifest.py --list)
          printf '%s\n' "${langs[@]}"
          python3 -m unittest discover -s scripts/tests
          expected=$'go\njava\npython\nrust\ntypescript'
          actual="$(printf '%s\n' "${langs[@]}")"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "::error::default language selection drifted"
            exit 1
          fi
