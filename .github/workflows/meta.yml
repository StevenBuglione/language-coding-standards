name: meta

on:
  push:
  pull_request:
  schedule:
    # Monthly repo hygiene run.
    - cron: "23 5 1 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  workflows:
    name: Lint GitHub workflows + enforce LF
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: actionlint over .github/workflows/**
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          rhysd/actionlint:1.7.12

      - name: Fail on any CR byte (LF-only policy)
        run: |
          offenders="$(git grep --cached -Il $'\r' -- . || true)"
          if [ -n "$offenders" ]; then
            echo "::error::CR bytes found in tracked files; LF-only policy violated:"
            echo "$offenders"
            exit 1
          fi
          echo "No CR bytes in tracked files."

  dockerfiles:
    name: Lint Dockerfiles
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: hadolint over **/Dockerfile
        run: |
          mapfile -t dockerfiles < <(find . -type f -name 'Dockerfile' | sort)
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo "No Dockerfiles exist yet; skipping hadolint (config .hadolint.yaml is passed once they do)."
            exit 0
          fi
          rc=0
          for f in "${dockerfiles[@]}"; do
            echo "::group::hadolint ${f}"
            docker run --rm --entrypoint hadolint -v "$GITHUB_WORKSPACE:/repo:ro" \
              hadolint/hadolint:v2.15.1 \
              -c /repo/.hadolint.yaml "/repo/${f}" || rc=1
            echo "::endgroup::"
          done
          exit "$rc"

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: gitleaks detect (--no-git)
        run: >
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo
          zricethezav/gitleaks:v8.30.1
          detect --source /repo --no-git --config /repo/.gitleaks.toml

  action-pins:
    name: Enforce action pinning policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Scan every "uses:" ref in workflow files
        shell: bash
        run: |
          rc=0
          while IFS= read -r u; do
            if [[ "$u" =~ ^actions/[A-Za-z0-9._/-]+@v[0-9]+$ ]]; then
              :
            elif [[ "$u" == ./* ]]; then
              :
            else
              echo "::error::uses: ref is neither 'actions/<name>@v<n>' nor local ('./...'): '${u}'"
              rc=1
            fi
          done < <(sed -nE 's/^[[:space:]]*(-[[:space:]]+)?uses:[[:space:]]*([^[:space:]#]+).*$/\2/p' .github/workflows/*.yml .github/workflows/*.yaml)
          if [ "$rc" -eq 0 ]; then
            echo "All uses: refs comply with the pinning policy."
          fi
          exit "$rc"
