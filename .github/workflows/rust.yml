name: rust

on:
  push:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
      - ".github/workflows/reusable-verify.yml"
      - "conformance/**"
      - "docs/CONTRACTS.md"
      - "docs/adr/**"
      - "standards/**"
      - "scripts/manifest.py"
      - "scripts/verify-all.sh"
      - "docker-compose.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust.yml"
      - ".github/workflows/reusable-verify.yml"
      - "conformance/**"
      - "docs/CONTRACTS.md"
      - "docs/adr/**"
      - "standards/**"
      - "scripts/manifest.py"
      - "scripts/verify-all.sh"
      - "docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    uses: ./.github/workflows/reusable-verify.yml
    with:
      language: rust
      image: rust:1.98.0-bookworm
      timeout_minutes: 75
