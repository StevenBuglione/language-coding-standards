name: python

on:
  push:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
      - ".github/workflows/reusable-verify.yml"
      - "conformance/**"
      - "docs/CONTRACTS.md"
      - "docs/adr/**"
      - "standards/**"
      - "scripts/manifest.py"
      - "scripts/verify-all.sh"
      - "docker-compose.yml"
  pull_request:
    paths:
      - "python/**"
      - ".github/workflows/python.yml"
      - ".github/workflows/reusable-verify.yml"
      - "conformance/**"
      - "docs/CONTRACTS.md"
      - "docs/adr/**"
      - "standards/**"
      - "scripts/manifest.py"
      - "scripts/verify-all.sh"
      - "docker-compose.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    uses: ./.github/workflows/reusable-verify.yml
    with:
      language: python
      image: python:3.13-slim
      setup: pip install --no-cache-dir uv==0.12.6
