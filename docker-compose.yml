# Hermetic local runners generated from standards/languages.yaml.
# Default profile: implemented packs only. Planned languages have no service
# until their directory exists (ADR-006).
name: language-coding-standards

services:
  python:
    build: { context: ./python }
    volumes:
      - ./python:/workspace
    working_dir: /workspace
    entrypoint: ["bash", "./verify.sh"]
    mem_limit: 2g

  typescript:
    build: { context: ./typescript }
    volumes:
      - ./typescript:/workspace
    working_dir: /workspace
    entrypoint: ["bash", "./verify.sh"]
    mem_limit: 2g

  go:
    build: { context: ./go }
    volumes:
      - ./go:/workspace
    working_dir: /workspace
    entrypoint: ["bash", "./verify.sh"]
    mem_limit: 2g

  rust:
    build: { context: ./rust }
    volumes:
      - ./rust:/workspace
    working_dir: /workspace
    entrypoint: ["bash", "./verify.sh"]
    mem_limit: 4g

  java:
    build: { context: ./java }
    volumes:
      - ./java:/workspace
    working_dir: /workspace
    entrypoint: ["bash", "./verify.sh"]
    mem_limit: 3g
