name: full

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: full ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            image: golang:1.26-bookworm
            setup: ""
          - language: java
            image: maven:3.9-eclipse-temurin-25
            setup: ""
          - language: python
            image: python:3.13
            setup: pip install --no-cache-dir uv==0.12.6
          - language: rust
            image: rust:1.98.0-bookworm
            setup: ""
          - language: typescript
            image: node:24-bookworm
            setup: ""
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Container preamble
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Extra setup
        if: ${{ matrix.setup != '' }}
        run: ${{ matrix.setup }}
      - name: Default capabilities
        working-directory: ${{ matrix.language }}
        run: bash ./verify.sh
      - name: Full-tier capabilities
        working-directory: ${{ matrix.language }}
        env:
          VERIFY_TIER: full
        run: bash ./verify.sh mutation
      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-${{ matrix.language }}
          path: artifacts/**
          if-no-files-found: ignore
